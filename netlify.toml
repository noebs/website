[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "https://noebs.sd/*"
  to = "https://userbase.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.noebs.sd/*"
  to = "https://userbase.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://noebs.netlify.com/*"
  to = "https://noebs.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"